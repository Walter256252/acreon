<svg viewBox="0 0 100 92" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="gi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <clipPath id="c">
      <polygon points="26,2 74,2 98,46 74,90 26,90 2,46"/>
    </clipPath>
  </defs>

  <!-- Property parcel boundary lines clipped inside hex -->
  <g clip-path="url(#c)" stroke="url(#gi)" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- Upper-left parcel boundary: hex left-edge → A → C → F → hex left-edge -->
    <path d="M 2,30 L 44,18 L 30,36 L 8,52" stroke-width="1.6"/>

    <!-- Upper parcel divider: A → B → hex top-right area -->
    <path d="M 44,18 L 62,8 L 80,20" stroke-width="1.6"/>

    <!-- Upper-right parcel: B → D → E -->
    <path d="M 62,8 L 68,30 L 80,20" stroke-width="1.4"/>

    <!-- Center horizontal divider: C → D → E → right edge -->
    <path d="M 30,36 L 50,44 L 68,30 L 92,40" stroke-width="1.6"/>

    <!-- Left parcel interior: C → F → G -->
    <path d="M 8,52 L 30,36" stroke-width="1.3"/>
    <path d="M 8,52 L 22,64 L 40,56" stroke-width="1.6"/>

    <!-- Center parcel: D → G → H -->
    <path d="M 50,44 L 40,56 L 56,68 L 68,54 L 50,44" stroke-width="1.5"/>

    <!-- Right parcel: E → right-edge → lower right -->
    <path d="M 68,30 L 88,46 L 72,64" stroke-width="1.6"/>
    <path d="M 88,46 L 92,40" stroke-width="1.3"/>

    <!-- Lower-right parcel: H → right → bottom-right -->
    <path d="M 68,54 L 72,64 L 60,80 L 74,90" stroke-width="1.5"/>
    <path d="M 72,64 L 88,46" stroke-width="1.3"/>

    <!-- Lower-left parcel: G → J → bottom-left -->
    <path d="M 22,64 L 34,80 L 26,90" stroke-width="1.5"/>

    <!-- Lower-center parcel: J → K → bottom -->
    <path d="M 34,80 L 56,68 L 60,80 L 46,90" stroke-width="1.5"/>

    <!-- Inner accent: small detail parcel near center -->
    <path d="M 40,56 L 34,80" stroke-width="1.3"/>
  </g>

  <!-- Hexagon border with gradient -->
  <polygon points="26,2 74,2 98,46 74,90 26,90 2,46"
           fill="none" stroke="url(#g)" stroke-width="4" stroke-linejoin="round"/>
</svg>
