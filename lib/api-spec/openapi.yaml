    DigestStats:
      type: object
      required: [totalProperties, totalEquityFormatted, totalDebtFormatted, avgLtv]
      properties:
        totalProperties:
          type: integer
        totalEquityFormatted:
          type: string
        totalDebtFormatted:
          type: string
        avgLtv:
          type: integer

    DigestContent:
      type: object
      required: [greeting, portfolioSummary, highlights, watchItems, closingLine, stats]
      properties:
        greeting:
          type: string
        portfolioSummary:
          type: string
        highlights:
          type: array
          items:
            $ref: "#/components/schemas/DigestHighlight"
        watchItems:
          type: array
          items:
            $ref: "#/components/schemas/DigestHighlight"
        closingLine:
          type: string
        stats:
          $ref: "#/components/schemas/DigestStats"

    EmailStatus:
      type: object
