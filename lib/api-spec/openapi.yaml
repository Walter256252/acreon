openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Real Estate Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: properties
    description: Real estate property management
  - name: payments
    description: Mortgage payment tracking
  - name: dashboard
    description: Portfolio summary
  - name: calculator
    description: What-if mortgage calculations
  - name: openai
    description: OpenAI AI chat operations
  - name: email
    description: Per-user email communications sync (IMAP — works with any provider)
  - name: user
    description: User preferences and monthly digest

paths:
  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"
  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}

  /projections:
    get:
      operationId: getProjections
      tags: [dashboard]
      summary: Portfolio projections at 5, 10, 15, 20, and 30 year milestones
      responses:
        "200":
          description: Projection snapshots for every property and portfolio totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionsResponse"

  /user/preferences:
    get:
      operationId: getUserPreferences
      tags: [user]
      summary: Get the current user's notification preferences
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
        "401":
          description: Not authenticated
    put:
      operationId: putUserPreferences
      tags: [user]
      summary: Update the current user's notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPreferencesInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]

  /user/digest/preview:
    post:
      operationId: postUserDigestPreview
      tags: [user]
      summary: Generate an AI digest preview without sending
      responses:
        "200":
          description: Digest content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigestContent"
        "401":
          description: Not authenticated

  /user/digest/send:
    post:
      operationId: postUserDigestSend
      tags: [user]
      summary: Generate and send the monthly digest to the user's email
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  sentTo:
                    type: string
                required: [success, sentTo]
        "400":
          description: No email address on account
        "401":
          description: Not authenticated

  /email/connection:
    get:
      operationId: getEmailConnection
      tags: [email]
      summary: Get the current user's email connection details
      responses:
        "200":
          description: Connection details (password excluded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailConnectionDetail"
        "401":
          description: Not authenticated
        "404":
          description: No connection found
    post:
      operationId: postEmailConnect
      tags: [email]
      summary: Test and save IMAP credentials for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailConnectInput"
      responses:
        "200":
          description: Connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailConnectResult"
        "400":
          description: Bad credentials or connection failure
        "401":
          description: Not authenticated
    delete:
      operationId: deleteEmailConnection
      tags: [email]
      summary: Disconnect the current user's email
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]

  /email/status:
    get:
      operationId: getEmailStatus
      tags: [email]
      summary: Check whether the current user has a connected email
      responses:
        "200":
          description: Email connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailStatus"

  /email/settings:
    get:
      operationId: getEmailSettings
      tags: [email]
      summary: Get email pull settings for all properties (scoped to current user)
      responses:
        "200":
          description: Per-property settings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmailPropertySettings"

  /email/settings/{propertyId}:
    put:
      operationId: putEmailSettingsPropertyId
      tags: [email]
      summary: Save email pull settings for a property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailPropertySettingsInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]

  /email/sync:
    post:
      operationId: postEmailSync
      tags: [email]
      summary: Sync email for all properties (current user)
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailSyncResult"
        "503":
          description: Email not connected

  /email/sync/{propertyId}:
    post:
      operationId: postEmailSyncPropertyId
      tags: [email]
      summary: Sync email for a single property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailSyncResult"
        "503":
          description: Email not connected

  /email/notes/{propertyId}:
    get:
      operationId: getEmailNotesPropertyId
      tags: [email]
      summary: Get AI email notes for a property grouped by month
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Notes grouped by month
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmailNotesByMonth"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /properties:
    get:
      operationId: listProperties
      tags: [properties]
      summary: List all properties
      responses:
        "200":
          description: List of properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Property"
    post:
      operationId: createProperty
      tags: [properties]
      summary: Add a new property
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"

  /properties/bulk-import:
    post:
      operationId: bulkImportProperties
      tags: [properties]
      summary: Import multiple properties at once (e.g. from a spreadsheet)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkImportInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportResult"

  /properties/{id}:
    get:
      operationId: getProperty
      tags: [properties]
      summary: Get a single property
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Property found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "404":
          description: Not found
    put:
      operationId: updateProperty
      tags: [properties]
      summary: Update a property
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "404":
          description: Not found
    delete:
      operationId: deleteProperty
      tags: [properties]
      summary: Delete a property
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /properties/{id}/payments:
    get:
      operationId: listPayments
      tags: [payments]
      summary: Get all logged payments for a property
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payments list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"
    post:
      operationId: logPayment
      tags: [payments]
      summary: Log an actual mortgage payment made
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Payment logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /properties/{id}/amortization:
    get:
      operationId: getAmortizationSchedule
      tags: [payments]
      summary: Get the full projected amortization schedule for a property
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Full amortization schedule
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AmortizationRow"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get portfolio-level summary
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /calculator:
    post:
      operationId: runCalculator
      tags: [calculator]
      summary: Run a what-if amortization calculation with extra payments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculatorInput"
      responses:
        "200":
          description: Calculator result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalculatorResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Property:
      type: object
      required:
        - id
        - name
        - address
        - yearBought
        - purchasePrice
        - currentValue
        - loanAmount
        - interestRate
        - loanTermYears
        - loanStartDate
        - monthlyPayment
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: string
        city:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
        zip:
          type: ["string", "null"]
        yearBought:
          type: integer
        purchasePrice:
          type: number
        currentValue:
          type: number
        loanAmount:
          type: number
        interestRate:
          type: number
          description: Annual interest rate as a percentage (e.g. 6.5)
        loanTermYears:
          type: integer
        loanStartDate:
          type: string
          description: ISO date string (YYYY-MM-DD)
        monthlyPayment:
          type: number
        currentLoanBalance:
          type: ["number", "null"]
          description: Known remaining loan balance; overrides computed balance in amortization schedule
        notes:
          type: ["string", "null"]
        valueLastUpdatedAt:
          type: ["string", "null"]
          description: ISO timestamp of when currentValue was last manually refreshed
        zillowUrl:
          type: ["string", "null"]
          description: Direct Zillow listing URL for this property
        monthlyTaxes:
          type: ["number", "null"]
          description: Monthly property tax amount
        monthlyInsurance:
          type: ["number", "null"]
          description: Monthly insurance amount
        monthlyRent:
          type: ["number", "null"]
          description: Monthly rental income
        autoPayEnabled:
          type: boolean
          description: When true, assume all past payments have been made on schedule
        savedExtraMonthly:
          type: ["number", "null"]
          description: Persistent extra principal added to every monthly payment
        savedExtraPayments:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ExtraPaymentEntry"
          description: Persistent one-time extra payments by payment number
        createdAt:
          type: string
        updatedAt:
          type: string

    BulkImportInput:
      type: object
      required: [properties]
      properties:
        properties:
          type: array
          items:
            $ref: "#/components/schemas/PropertyInput"

    BulkImportResultError:
      type: object
      required: [row, message]
      properties:
        row:
          type: integer
        message:
          type: string

    BulkImportResult:
      type: object
      required: [imported, failed]
      properties:
        imported:
          type: integer
        failed:
          type: integer
        errors:
          type: array
          items:
            $ref: "#/components/schemas/BulkImportResultError"

    PropertyInput:
      type: object
      required:
        - name
        - address
        - yearBought
        - purchasePrice
        - currentValue
        - loanAmount
        - interestRate
        - loanTermYears
        - loanStartDate
        - monthlyPayment
      properties:
        name:
          type: string
          minLength: 1
        address:
          type: string
          minLength: 1
        city:
          type: string
          description: City (used for map placement)
        state:
          type: string
          description: State abbreviation (e.g. CA)
        zip:
          type: string
          description: ZIP / postal code
        yearBought:
          type: integer
        purchasePrice:
          type: number
        currentValue:
          type: number
        loanAmount:
          type: number
        interestRate:
          type: number
        loanTermYears:
          type: integer
        loanStartDate:
          type: string
        monthlyPayment:
          type: number
        currentLoanBalance:
          type: ["number", "null"]
          description: Known remaining loan balance; overrides computed balance in amortization schedule
        monthlyTaxes:
          type: ["number", "null"]
          description: Monthly property tax amount
        monthlyInsurance:
          type: ["number", "null"]
          description: Monthly insurance amount
        monthlyRent:
          type: ["number", "null"]
          description: Monthly rental income
        notes:
          type: string
        zillowUrl:
          type: string

    PropertyUpdate:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        city:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
        zip:
          type: ["string", "null"]
        yearBought:
          type: integer
        purchasePrice:
          type: number
        currentValue:
          type: number
        loanAmount:
          type: number
        interestRate:
          type: number
        loanTermYears:
          type: integer
        loanStartDate:
          type: string
        monthlyPayment:
          type: number
        notes:
          type: ["string", "null"]
        autoPayEnabled:
          type: boolean
        savedExtraMonthly:
          type: ["number", "null"]
        savedExtraPayments:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ExtraPaymentEntry"
        currentLoanBalance:
          type: ["number", "null"]
          description: Known remaining loan balance; overrides computed balance in amortization schedule
        monthlyTaxes:
          type: ["number", "null"]
          description: Monthly property tax amount
        monthlyInsurance:
          type: ["number", "null"]
          description: Monthly insurance amount
        monthlyRent:
          type: ["number", "null"]
          description: Monthly rental income
        valueLastUpdatedAt:
          type: ["string", "null"]
        zillowUrl:
          type: ["string", "null"]

    Payment:
      type: object
      required:
        - id
        - propertyId
        - paymentDate
        - paymentAmount
        - principalAmount
        - interestAmount
        - remainingBalance
        - createdAt
      properties:
        id:
          type: integer
        propertyId:
          type: integer
        paymentDate:
          type: string
        paymentAmount:
          type: number
        principalAmount:
          type: number
        interestAmount:
          type: number
        extraPayment:
          type: number
        remainingBalance:
          type: number
        paymentNumber:
          type: integer
        createdAt:
          type: string

    PaymentInput:
      type: object
      required:
        - paymentDate
        - paymentAmount
        - principalAmount
        - interestAmount
        - remainingBalance
      properties:
        paymentDate:
          type: string
        paymentAmount:
          type: number
        principalAmount:
          type: number
        interestAmount:
          type: number
        extraPayment:
          type: number
        remainingBalance:
          type: number
        paymentNumber:
          type: integer

    AmortizationRow:
      type: object
      required:
        - paymentNumber
        - paymentDate
        - paymentAmount
        - principalAmount
        - interestAmount
        - remainingBalance
        - cumulativeInterest
        - cumulativePrincipal
      properties:
        paymentNumber:
          type: integer
        paymentDate:
          type: string
        paymentAmount:
          type: number
        principalAmount:
          type: number
        interestAmount:
          type: number
        remainingBalance:
          type: number
        cumulativeInterest:
          type: number
        cumulativePrincipal:
          type: number
        isLogged:
          type: boolean

    DashboardStats:
      type: object
      required:
        - totalProperties
        - totalPortfolioValue
        - totalLoanBalance
        - totalEquity
        - monthlyPaymentTotal
        - properties
      properties:
        totalProperties:
          type: integer
        totalPortfolioValue:
          type: number
        totalLoanBalance:
          type: number
        totalEquity:
          type: number
        monthlyPaymentTotal:
          type: number
        avgEquityPercent:
          type: number
        mostEquity:
          nullable: true
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            equity: { type: number }
            equityPercent: { type: number }
        leastEquity:
          nullable: true
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            equity: { type: number }
            equityPercent: { type: number }
        nextPayoff:
          nullable: true
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            payoffDate: { type: string, nullable: true }
            estimatedBalance: { type: number }
        bestAppreciation:
          nullable: true
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            appreciation: { type: number }
            appreciationPercent: { type: number }
        highestLTV:
          nullable: true
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            ltv: { type: number }
            estimatedBalance: { type: number }
        properties:
          type: array
          items:
            $ref: "#/components/schemas/PropertySummary"

    PropertySummary:
      type: object
      required:
        - id
        - name
        - address
        - currentValue
        - estimatedBalance
        - equity
        - equityPercent
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: string
        currentValue:
          type: number
        estimatedBalance:
          type: number
        equity:
          type: number
        equityPercent:
          type: number
        valueLastUpdatedAt:
          type: ["string", "null"]
        zillowUrl:
          type: ["string", "null"]

    CalculatorInput:
      type: object
      required:
        - loanAmount
        - interestRate
        - loanTermYears
        - loanStartDate
        - monthlyPayment
      properties:
        loanAmount:
          type: number
        interestRate:
          type: number
        loanTermYears:
          type: integer
        loanStartDate:
          type: string
        monthlyPayment:
          type: number
        extraPaymentMonthly:
          type: number
          description: Fixed extra payment added every month
        extraPayments:
          type: array
          description: One-time extra payments for specific months
          items:
            $ref: "#/components/schemas/ExtraPaymentEntry"

    ExtraPaymentEntry:
      type: object
      required:
        - paymentNumber
        - amount
      properties:
        paymentNumber:
          type: integer
        amount:
          type: number

    CalculatorResult:
      type: object
      required:
        - schedule
        - summary
      properties:
        schedule:
          type: array
          items:
            $ref: "#/components/schemas/AmortizationRow"
        summary:
          $ref: "#/components/schemas/CalculatorSummary"

    CalculatorSummary:
      type: object
      required:
        - totalPayments
        - totalInterest
        - totalPrincipal
        - payoffDate
        - monthsSaved
        - interestSaved
      properties:
        totalPayments:
          type: integer
        totalInterest:
          type: number
        totalPrincipal:
          type: number
        payoffDate:
          type: string
        monthsSaved:
          type: integer
        interestSaved:
          type: number

    ProjectionsResponse:
      type: object
      required: [asOf, properties, totals, currentTotals]
      properties:
        asOf:
          type: string
        properties:
          type: array
          items:
            $ref: "#/components/schemas/PropertyProjection"
        totals:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioMilestone"
        currentTotals:
          $ref: "#/components/schemas/CurrentTotals"

    PropertyProjection:
      type: object
      required: [id, name, address, currentValue, loanAmount, interestRate, loanTermYears, monthlyPayment, currentBalance, snapshots]
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: string
        currentValue:
          type: number
        loanAmount:
          type: number
        interestRate:
          type: number
        loanTermYears:
          type: integer
        monthlyPayment:
          type: number
        currentBalance:
          type: number
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/PropertyMilestone"

    PropertyMilestone:
      type: object
      required: [years, remainingBalance, cumulativeInterestPaid, cumulativePrincipalPaid, equity, isPaidOff]
      properties:
        years:
          type: integer
        remainingBalance:
          type: number
        cumulativeInterestPaid:
          type: number
        cumulativePrincipalPaid:
          type: number
        equity:
          type: number
        isPaidOff:
          type: boolean
        payoffDate:
          type: string

    PortfolioMilestone:
      type: object
      required: [years, totalValue, totalRemainingBalance, totalEquity, totalInterestPaid, totalPrincipalPaid]
      properties:
        years:
          type: integer
        totalValue:
          type: number
        totalRemainingBalance:
          type: number
        totalEquity:
          type: number
        totalInterestPaid:
          type: number
        totalPrincipalPaid:
          type: number

    CurrentTotals:
      type: object
      required: [totalValue, totalBalance, totalEquity, monthlyPaymentTotal]
      properties:
        totalValue:
          type: number
        totalBalance:
          type: number
        totalEquity:
          type: number
        monthlyPaymentTotal:
          type: number

    UserPreferences:
      type: object
      required: [monthlyDigestEnabled]
      properties:
        monthlyDigestEnabled:
          type: boolean
        lastDigestSentAt:
          type: ["string", "null"]

    UserPreferencesInput:
      type: object
      required: [monthlyDigestEnabled]
      properties:
        monthlyDigestEnabled:
          type: boolean

    DigestHighlight:
      type: object
